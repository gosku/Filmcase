<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ image.filename }}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <script src="/static/js/multi-select.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
  <link rel="stylesheet" href="/static/css/brand.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; font-family: sans-serif; height: 100vh; overflow: hidden; }

    .content-area { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    .sidebar {
      width: 320px;
      min-width: 320px;
      padding: 1.5rem;
      border-right: 1px solid #e0e0e0;
      overflow-y: auto;
      background: var(--color-bg-surface);
    }

    .filter-group {
      margin-bottom: 1.2rem;
    }

    .filter-label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #444;
      margin-bottom: 0.35rem;
    }

    .filter-select {
      width: 100%;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      background: #fff;
      cursor: pointer;
    }

    .ts-wrapper { width: 100%; }
    .ts-control { font-size: 0.9rem; }
    .ts-wrapper.single.has-items .ts-control input { width: 0; min-width: 0; }

    .clear-filters-btn {
      display: block;
      width: 100%;
      padding: 0.35rem 0.5rem;
      margin-bottom: 1.2rem;
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #666;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .clear-filters-btn:hover {
      background: #f0f0f0;
      color: #333;
    }

    .filter-checkboxes {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      max-height: 180px;
      overflow-y: auto;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.1rem 0.2rem;
      border-radius: 3px;
      color: #333;
      user-select: none;
    }

    .filter-option input[type="checkbox"] {
      accent-color: var(--color-accent);
    }

    .filter-option:hover { background: #f0f0f0; }

    .filter-option--unavailable { color: #bbb; }

    .filter-option--unavailable input[type="checkbox"] { opacity: 0.4; }

    .filter-option-value {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filter-option-count {
      font-size: 0.75rem;
      color: #999;
      flex-shrink: 0;
    }

    .filter-option--unavailable .filter-option-count { color: #ccc; }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .gallery-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 2rem 2rem;
    }

    .rating-toggle {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: #555;
      user-select: none;
    }

    .rating-toggle input[type="checkbox"] {
      appearance: none;
      width: 2rem;
      height: 1.1rem;
      background: #ccc;
      border-radius: 1rem;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .rating-toggle input[type="checkbox"]:checked { background: var(--color-accent); }

    .rating-toggle input[type="checkbox"]::after {
      content: '';
      position: absolute;
      width: 0.85rem;
      height: 0.85rem;
      background: #fff;
      border-radius: 50%;
      top: 0.125rem;
      left: 0.125rem;
      transition: left 0.2s;
    }

    .rating-toggle input[type="checkbox"]:checked::after {
      left: calc(100% - 0.975rem);
    }

    #gallery-results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .infinite-scroll-sentinel {
      height: 300px;
      visibility: hidden;
      pointer-events: none;
    }

    .image-card {
      min-width: 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.5rem;
      background: #fff;
    }

    .image-thumbnail {
      width: 100%;
      height: 300px;
      object-fit: contain;
      display: block;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      background: #f0f0f0;
    }

    .image-recipe {
      display: block;
      font-weight: 600;
      font-size: 1rem;
      color: #222;
      margin-bottom: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .image-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.15rem;
    }

    .image-exposure { font-size: 0.9rem; color: #555; }

    .image-filename {
      font-size: 0.85rem;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
    }

    .recipe-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.3rem;
    }

    .recipe-label {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .rl-dr, .rl-drp, .rl-gr, .rl-gs, .rl-cce, .rl-ccfx,
    .rl-wb, .rl-r, .rl-b, .rl-hl, .rl-sh, .rl-co, .rl-srp,
    .rl-ns, .rl-cl {
      background: #eef0f3;
      color: #3d4754;
    }

    .image-rating {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-accent);
      background: var(--color-accent-light);
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
    }

    .no-results {
      grid-column: 1 / -1;
      color: #888;
      font-style: italic;
    }

    .gallery-header {
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
      flex-shrink: 0;
      min-height: 4rem;
    }

    /* ── Multi-select ────────────────────────────────────────────────── */
    .image-card {
      position: relative;
    }

    .image-card .ms-checkbox {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s, background 0.12s, border-color 0.12s;
      cursor: pointer;
      z-index: 2;
    }

    .image-card:hover .ms-checkbox,
    #gallery-results.ms-active .image-card .ms-checkbox {
      opacity: 1;
      pointer-events: auto;
    }

    .image-card .ms-checkbox:hover {
      border-color: var(--color-accent);
      background: var(--color-accent-light);
    }

    .image-card .ms-check {
      opacity: 0;
      transition: opacity 0.12s;
    }

    .image-card.ms-selected .ms-checkbox {
      background: var(--color-accent);
      border-color: var(--color-accent);
    }

    .image-card.ms-selected .ms-check {
      opacity: 1;
    }

    .image-card.ms-selected {
      outline: 3px solid var(--color-accent);
      outline-offset: -3px;
    }

    #detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
    }

    #detail-overlay .detail-overlay { height: 100%; }

    /* ------------------------------------ */
    /* Mobile layout (<= 768px)             */
    /* ------------------------------------ */

    /* Controls that exist only in the mobile layout are hidden by default so the
       desktop layout is untouched; the media query below reveals them. */
    .mobile-subbar,
    .sidebar__mobile-head,
    .sidebar__done,
    .filters-backdrop { display: none; }

    @media (max-width: 1024px) and (orientation: portrait), (max-width: 768px) {
      body { height: 100dvh; }

      /* The desktop header row only holds the multi-select toolbar; collapse it
         so it takes no space until a selection docks it to the bottom. */
      .gallery-header { padding: 0; min-height: 0; }

      .gallery-scroll { padding: 1rem; }

      /* Responsive columns: 1 on phones, 2 on wider tablet-portrait widths. */
      #gallery-results { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

      /* Filter sidebar becomes an off-canvas drawer (same pattern as the gallery). */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 160;
        width: min(88%, 340px);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 8px 0 30px rgba(15, 23, 42, 0.28);
      }

      .sidebar--open { transform: translateX(0); }

      .sidebar__mobile-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: -1.5rem -1.5rem 1rem;
        padding: 1rem 1.5rem 0.75rem;
        border-bottom: 1px solid #e0e0e0;
      }

      .sidebar__mobile-title {
        font-size: 1.05rem;
        font-weight: 800;
        color: #222;
      }

      .sidebar__close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: none;
        border: none;
        border-radius: 8px;
        color: #888;
        cursor: pointer;
      }

      .sidebar__close:hover { background: #f0f0f0; color: #333; }

      .sidebar__done {
        display: block;
        position: sticky;
        bottom: 0;
        width: 100%;
        margin-top: 1rem;
        padding: 0.85rem 1rem;
        background: var(--color-accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 -10px 16px rgba(241, 245, 249, 0.95);
      }

      .filters-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 155;
        background: rgba(15, 23, 42, 0.5);
      }

      .filters-backdrop[hidden] { display: none; }

      /* Sub-bar above the gallery with the Filters trigger. */
      .mobile-subbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: var(--color-bg-page);
        border-bottom: 1px solid var(--color-border);
        overflow: hidden;
        min-height: 0;
        max-height: 5.5rem;
        transition: max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease;
      }

      /* Hidden when scrolling down; it collapses so the gallery gets the space. */
      .mobile-subbar--hidden {
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        opacity: 0;
        border-bottom-color: transparent;
      }

      .mobile-filters-btn {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 50px;
        padding: 0 16px;
        background: var(--color-bg-page);
        color: var(--color-text-primary);
        border: 1px solid var(--color-border);
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }

      .mobile-filters-btn:hover { background: var(--color-bg-surface); }

      /* Touch-friendly filter controls inside the drawer. */
      .filter-label { font-size: 0.9rem; margin-bottom: 0.5rem; }
      .clear-filters-btn { padding: 0.6rem 0.75rem; font-size: 0.95rem; }
      .rating-toggle { min-height: 44px; font-size: 0.95rem; }
      .filter-select { min-height: 44px; font-size: 1rem; }
      .ts-control { min-height: 44px; font-size: 1rem; }

      .filter-checkboxes { max-height: 16rem; }
      .filter-option {
        gap: 0.75rem;
        min-height: 44px;
        padding: 0.4rem 0.35rem;
      }
      .filter-option input[type="checkbox"] {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }
      .filter-option-value { font-size: 1rem; }
      .filter-option-count { font-size: 0.85rem; }

      /* Keep a long-press from raising the browser's text/callout selection. */
      .image-card {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Multi-select toolbar docks to the bottom of the screen. */
      .gallery-header .ms-toolbar:not([hidden]) {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 150;
        height: 64px;
        padding: 0 14px;
        background: var(--color-bg-page);
        border-top: 1px solid var(--color-border);
        box-shadow: 0 -6px 20px rgba(15, 23, 42, 0.08);
      }

      .gallery-header .ms-count { flex: 1; font-size: 1rem; }

      .gallery-header .ms-cancel-btn,
      .gallery-header .ms-actions-btn {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 1.1rem;
        font-size: 1rem;
        border-radius: 10px;
      }

      .gallery-header .ms-actions-dropdown {
        top: auto;
        bottom: calc(100% + 8px);
        left: auto;
        right: 0;
        min-width: 220px;
      }

      .ms-actions-option {
        padding: 0.9rem 1.1rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

{% include "_top_nav.html" with active_section="images" %}

<div class="content-area">

<aside class="sidebar">
  <div class="sidebar__mobile-head">
    <span class="sidebar__mobile-title">Filters</span>
    <button type="button" class="sidebar__close" id="close-filters-btn" aria-label="Close filters">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
  </div>
  <a href="{% url 'gallery' %}" class="clear-filters-btn">Clear all filters</a>
  <form id="filter-form"
        hx-get="{% url 'gallery' %}"
        hx-trigger="change"
        hx-target="#gallery-results"
        hx-push-url="true">
    <div class="filter-group">
      <label class="rating-toggle" for="rating-first-toggle">
        <input type="checkbox" id="rating-first-toggle">
        Sort by rating
      </label>
      <input type="hidden" name="rating_first" id="rating-first-input" value="{{ request.GET.rating_first|default:'1' }}">
    </div>
    <div id="recipe-filter"></div>
    <div id="sidebar-filters"></div>
  </form>
  <button type="button" class="sidebar__done" id="close-filters-done">Show images</button>
</aside>
<div class="filters-backdrop" id="filters-backdrop" hidden></div>

<main class="main">
  <div class="mobile-subbar">
    <button type="button" class="mobile-filters-btn" id="open-filters-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
      </svg>
      Filters
    </button>
  </div>
  <div class="gallery-header">
    <div class="ms-toolbar" id="ms-toolbar" hidden>
      <span class="ms-count">0 selected</span>
      <button class="ms-cancel-btn" type="button">Cancel</button>
      <div class="ms-actions-wrap">
        <button class="ms-actions-btn" id="ms-actions-btn" type="button">
          Actions
          <svg width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="ms-actions-dropdown" id="ms-actions-dropdown" hidden>
          <span class="ms-actions-empty">No actions available yet</span>
        </div>
      </div>
    </div>
  </div>
  <div class="gallery-scroll">
    <div id="gallery-results"
         hx-get="{% url 'gallery' %}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}"
         hx-trigger="load"
         hx-target="#gallery-results"
         hx-swap="innerHTML">
    </div>
    <div id="load-more-sentinel"></div>
  </div>
</main>

</div><!-- .content-area -->

<div id="detail-overlay">
  {% include "images/_image_detail_partial.html" %}
</div>

<script>
  function initRecipeSelects() {
    document.querySelectorAll('.filter-select-search').forEach(function (el) {
      if (el.tomselect) return;
      new TomSelect(el, {
        create: false,
        plugins: ['remove_button'],
        onChange: function () {
          document.getElementById('filter-form').dispatchEvent(new Event('change'));
        },
      });
    });
  }
  initRecipeSelects();

  document.body.addEventListener('htmx:oobBeforeSwap', function (evt) {
    if (!evt.detail.target || evt.detail.target.id !== 'recipe-filter') return;
    var select = evt.detail.target.querySelector('.filter-select-search');
    if (!select || !select.tomselect) return;
    var newSelect = evt.detail.fragment.querySelector('select');
    if (!newSelect) return;
    var ts = select.tomselect;
    var newOpts = Array.from(newSelect.querySelectorAll('option')).map(function (opt) {
      return { value: opt.value, text: opt.textContent.trim() };
    });
    ts.clearOptions();
    ts.addOptions(newOpts);
    ts.refreshOptions(false);
    evt.detail.shouldSwap = false;
  });

  (function () {
    var urlParams = new URLSearchParams(window.location.search);
    var hiddenInput = document.getElementById('rating-first-input');
    var toggle = document.getElementById('rating-first-toggle');

    var val;
    if (urlParams.has('rating_first')) {
      val = urlParams.get('rating_first');
    } else {
      val = localStorage.getItem('ratingFirst') ?? '1';
      urlParams.set('rating_first', val);
      history.replaceState(null, '', '?' + urlParams.toString());
    }

    hiddenInput.value = val;
    toggle.checked = val === '1';

    toggle.addEventListener('change', function () {
      var newVal = toggle.checked ? '1' : '0';
      localStorage.setItem('ratingFirst', newVal);
      hiddenInput.value = newVal;
      document.getElementById('filter-form').dispatchEvent(new Event('change'));
    });
  })();

  document.body.addEventListener('htmx:afterSettle', function (e) {
    if (e.detail.target && e.detail.target.id === 'gallery-results') {
      initRecipeSelects();
    }
  });

  const imageMultiSelect = new MultiSelectController({
    containerSelector: '#gallery-results',
    cardSelector: '.image-card',
    toolbarSelector: '#ms-toolbar',
  });

  (function () {
    var actionsBtn = document.getElementById('ms-actions-btn');
    var actionsDropdown = document.getElementById('ms-actions-dropdown');
    actionsBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      actionsDropdown.hidden = !actionsDropdown.hidden;
    });
    document.addEventListener('click', function () {
      actionsDropdown.hidden = true;
    });
  }());

  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.detail.target.id !== 'detail-overlay') return;
    var overlay = e.detail.target;
    overlay.hidden = false;
    document.querySelector('.gallery-scroll').style.overflow = 'hidden';

    // A navigation slide (if any) has completed with this swap.
    sliding = false;

    var img = overlay.querySelector('.detail-image');
    if (!img || !img.dataset.fullSrc) return;
    var fullSrc = img.dataset.fullSrc;

    function afterFullLoaded() {
      img.src = fullSrc;
      stageNeighbours();
    }

    if (preloadedUrls.has(fullSrc)) { afterFullLoaded(); }
    else { var full = new Image(); full.onload = afterFullLoaded; full.src = fullSrc; }
  });

  var preloadedUrls = new Set();

  // On direct page load the overlay is pre-rendered, so htmx:afterSwap never
  // fires. Run the same full-size loading logic immediately on DOMContentLoaded.
  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.getElementById('detail-overlay');
    var img = overlay && overlay.querySelector('.detail-image');
    if (!img || !img.dataset.fullSrc) return;
    var fullSrc = img.dataset.fullSrc;
    var full = new Image();
    full.onload = function () {
      img.src = fullSrc;
      stageNeighbours();
    };
    full.src = fullSrc;
  });

  window.closeImageDetail = function () {
    document.getElementById('detail-overlay').hidden = true;
    document.querySelector('.gallery-scroll').style.overflow = '';
    var params = new URLSearchParams(window.location.search);
    history.replaceState(null, '', '/images/' + (params.toString() ? '?' + params.toString() : ''));
  };

  document.body.addEventListener('htmx:beforeHistoryUpdate', function (e) {
    if (e.detail.target && e.detail.target.id === 'detail-overlay') {
      var params = new URLSearchParams(window.location.search);
      if (params.toString()) {
        e.detail.history.path = e.detail.history.path + '?' + params.toString();
      }
    }
  });

  document.addEventListener('keydown', function (e) {
    var overlay = document.getElementById('detail-overlay');
    if (!overlay || overlay.hidden) return;
    if (e.key === 'Escape') window.closeImageDetail();
    if (e.key === 'ArrowLeft') { var btn = overlay.querySelector('.detail-nav-prev'); if (btn) btn.click(); }
    if (e.key === 'ArrowRight') { var btn = overlay.querySelector('.detail-nav-next'); if (btn) btn.click(); }
  });

  /* --------------------------------------------------------------------- *
   * Directional slide transition for next/prev navigation.
   *
   * Navigation still flows through the nav buttons' htmx requests; we play a
   * slide first, then let the button fire. Every input shares this path: arrow
   * clicks and the Arrow keys route through the click interceptor below, and
   * the mobile finger-following drag drives it directly. It falls back to the
   * plain instant swap under prefers-reduced-motion or where the Web
   * Animations API is missing.
   *
   * The neighbour images are mounted off-frame ahead of time (see
   * stageNeighbours), so the incoming image is already decoded and painted and
   * slides straight in instead of arriving a frame late and looking empty.
   * Everything is expressed in percentages of the photo's own width, which is
   * exactly one slide's distance, so the units line up with the CSS.
   * --------------------------------------------------------------------- */
  var SLIDE_MS = 180;
  var SNAP_MS = 140;
  var sliding = false;

  function slideAnimationsSupported() {
    if (window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      return false;
    }
    return typeof Element.prototype.animate === 'function';
  }

  function detailNavButton(direction) {
    var overlay = document.getElementById('detail-overlay');
    if (!overlay) return null;
    return overlay.querySelector(
      direction === 'next' ? '.detail-nav-next' : '.detail-nav-prev');
  }

  function restPercent(direction) { return direction === 'next' ? '100%' : '-100%'; }

  // Re-fire the button click, flagged so the interceptor lets htmx handle it.
  function navigateNow(btn) {
    if (!btn) return;
    btn._bypassSlide = true;
    btn.click();
  }

  // Mount the neighbour images off-frame so the browser fetches, decodes and
  // paints them before any navigation. Re-run after every swap, since the
  // column is replaced each time. Doubles as the preload: each staged image
  // warms the cache for the page it points at.
  function stageNeighbours() {
    var overlay = document.getElementById('detail-overlay');
    var col = overlay && overlay.querySelector('.detail-image-col');
    if (!col) return;
    ['prev', 'next'].forEach(function (direction) {
      if (col.querySelector('.detail-slide-in[data-dir="' + direction + '"]')) return;
      var btn = detailNavButton(direction);
      var url = btn && btn.dataset.preloadUrl;
      if (!url) return;
      var img = document.createElement('img');
      img.className = 'detail-slide-in';
      img.dataset.dir = direction;
      img.alt = '';
      img.style.transform = 'translateX(' + restPercent(direction) + ')';
      img.addEventListener('load', function () { preloadedUrls.add(url); });
      img.src = url;
      if (img.decode) { img.decode().catch(function () {}); }
      col.appendChild(img);
    });
  }

  function stagedImage(direction) {
    var overlay = document.getElementById('detail-overlay');
    var col = overlay && overlay.querySelector('.detail-image-col');
    return col ? col.querySelector('.detail-slide-in[data-dir="' + direction + '"]') : null;
  }

  // Animate translateX between two <length-percentage> strings. `fill:forwards`
  // holds the end frame; callers that keep the element (a snap-back) settle it
  // afterwards so animations do not accumulate.
  function animateX(el, fromX, toX, duration) {
    return el.animate(
      [{ transform: 'translateX(' + fromX + ')' },
       { transform: 'translateX(' + toX + ')' }],
      { duration: duration, easing: 'ease-out', fill: 'forwards' });
  }

  // Animate to `toX` and then write it to the inline style and drop the
  // animation, leaving a clean resting element (used for snap-backs, whose
  // elements outlive the gesture). `toX` of '0%' clears the transform.
  function settleX(el, fromX, toX, duration, done) {
    var anim = animateX(el, fromX, toX, duration);
    setTimeout(function () {
      el.style.transform = toX === '0%' ? '' : 'translateX(' + toX + ')';
      anim.cancel();
      if (done) done();
    }, duration);
  }

  // Click / keyboard path: slide the current image out, the staged neighbour
  // in, then navigate. Falls back to an immediate navigation when the neighbour
  // is not staged (e.g. end of the list).
  function slideThenNavigate(direction, btn) {
    if (sliding) return;
    var overlay = document.getElementById('detail-overlay');
    var col = overlay && overlay.querySelector('.detail-image-col');
    var current = col && col.querySelector('.detail-image');
    var incoming = stagedImage(direction);
    if (!current || !incoming) { navigateNow(btn); return; }
    sliding = true;
    animateX(current, '0%', direction === 'next' ? '-100%' : '100%', SLIDE_MS);
    animateX(incoming, restPercent(direction), '0%', SLIDE_MS);
    // Drive the navigation on a timer rather than the animation's `finished`
    // promise: a hidden or throttled tab pauses Web Animations, and we must
    // still complete the swap so the view never gets stuck mid-slide.
    setTimeout(function () { navigateNow(btn); }, SLIDE_MS);
  }

  // Intercept arrow-button clicks (Arrow keys dispatch the same click) so they
  // animate. The bypass flag lets the real htmx click through once the slide
  // has played; without animation support we let htmx swap instantly.
  (function () {
    var overlay = document.getElementById('detail-overlay');
    if (!overlay) return;
    overlay.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.detail-nav');
      if (!btn) return;
      if (btn._bypassSlide) { btn._bypassSlide = false; return; }
      if (!slideAnimationsSupported() || sliding) return;   // instant fallback
      e.preventDefault();
      e.stopPropagation();
      slideThenNavigate(
        btn.classList.contains('detail-nav-next') ? 'next' : 'prev', btn);
    }, true);
  }());

  // Mobile: finger-following horizontal drag on the photo. It replaces the old
  // start/end-point swipe, which dropped short, fast, or slightly diagonal
  // gestures. Moving the image with the finger and committing on distance OR
  // flick velocity makes the gesture reliable; when animation is unavailable
  // the same distance/velocity test still navigates, just without the follow.
  (function () {
    var overlay = document.getElementById('detail-overlay');
    if (!overlay) return;

    var active = false, decided = false, horizontal = false, animate = false,
        direction = null, current = null, incoming = null,
        width = 0, startX = 0, startY = 0, startT = 0, dx = 0;

    function reset() {
      active = false; decided = false; horizontal = false; animate = false;
      direction = null; current = null; incoming = null;
      width = 0; dx = 0;
    }

    // Percentage of the photo's width a pixel drag represents; the staged
    // images are exactly one width wide, so the numbers line up with the CSS.
    function pctOf(px) { return width ? (px / width * 100) : 0; }

    overlay.addEventListener('touchstart', function (e) {
      if (sliding || e.touches.length !== 1) { reset(); return; }
      var c = e.target.closest && e.target.closest('.detail-image-col');
      if (!c) return;
      current = c.querySelector('.detail-image');
      if (!current) { reset(); return; }
      active = true; decided = false; horizontal = false;
      animate = slideAnimationsSupported();
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startT = Date.now();
      dx = 0;
    }, { passive: true });

    overlay.addEventListener('touchmove', function (e) {
      if (!active) return;
      var t = e.touches[0];
      var mx = t.clientX - startX, my = t.clientY - startY;
      if (!decided) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;   // not moved yet
        decided = true;
        horizontal = Math.abs(mx) > Math.abs(my);
        if (horizontal) {
          direction = mx < 0 ? 'next' : 'prev';
          if (animate) {
            width = current.getBoundingClientRect().width;
            incoming = stagedImage(direction);
            if (!incoming) direction = null;   // end of list: rubber-band only
          }
        }
      }
      if (!horizontal) return;                 // vertical: leave it to the page
      e.preventDefault();                      // own the horizontal gesture
      dx = mx;
      if (!animate) return;                    // reduced motion: no follow
      if (!incoming) dx = mx * 0.3;            // resistance with no neighbour
      var pct = pctOf(dx);
      current.style.transform = 'translateX(' + pct + '%)';
      if (incoming) {
        var base = direction === 'next' ? 100 : -100;
        incoming.style.transform = 'translateX(' + (base + pct) + '%)';
      }
    }, { passive: false });

    function endDrag() {
      if (!active) return;
      var wasHorizontal = horizontal, wasDecided = decided, dir = direction,
          dist = dx, elapsed = Date.now() - startT, doAnimate = animate,
          cur = current, inc = incoming, w = width;
      reset();

      if (!wasDecided || !wasHorizontal) {     // a tap or a vertical drag
        if (cur) cur.style.transform = '';
        return;
      }

      var pct = w ? (dist / w * 100) : 0;
      var incBase = dir === 'next' ? 100 : -100;

      // Commit on a quarter-width drag, or a shorter fast flick.
      var velocity = Math.abs(dist) / Math.max(elapsed, 1);   // px/ms
      var committed = dir && (Math.abs(dist) > w * 0.25 ||
                              (velocity > 0.5 && Math.abs(dist) > 40));

      if (committed && !doAnimate) { navigateNow(detailNavButton(dir)); return; }

      if (committed) {
        sliding = true;
        animateX(cur, pct + '%', dir === 'next' ? '-100%' : '100%', SLIDE_MS);
        animateX(inc, (incBase + pct) + '%', '0%', SLIDE_MS);
        var btn = detailNavButton(dir);
        setTimeout(function () { navigateNow(btn); }, SLIDE_MS);
        return;
      }

      // Not committed: snap the photo back to rest; the staged neighbour
      // returns to its off-frame position and stays mounted for next time.
      if (cur) settleX(cur, pct + '%', '0%', SNAP_MS);
      if (inc) settleX(inc, (incBase + pct) + '%', restPercent(dir), SNAP_MS);
    }

    overlay.addEventListener('touchend', endDrag);
    overlay.addEventListener('touchcancel', endDrag);
  }());
</script>

<script>
  // Mobile filter drawer open/close.
  (function () {
    var sidebar  = document.querySelector('.sidebar');
    var openBtn  = document.getElementById('open-filters-btn');
    var backdrop = document.getElementById('filters-backdrop');
    var closeEls = [
      document.getElementById('close-filters-btn'),
      document.getElementById('close-filters-done'),
    ];
    if (!sidebar || !openBtn || !backdrop) return;

    function openFilters() {
      sidebar.classList.add('sidebar--open');
      backdrop.hidden = false;
    }

    function closeFilters() {
      sidebar.classList.remove('sidebar--open');
      backdrop.hidden = true;
    }

    openBtn.addEventListener('click', openFilters);
    backdrop.addEventListener('click', closeFilters);
    closeEls.forEach(function (el) { if (el) el.addEventListener('click', closeFilters); });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sidebar.classList.contains('sidebar--open')) closeFilters();
    });
  }());
</script>

<script>
  // Hide the mobile sub-bar (Filters) when scrolling down, reveal it when
  // scrolling up or at the top.
  (function () {
    var scroller = document.querySelector('.gallery-scroll');
    var bar = document.querySelector('.mobile-subbar');
    if (!scroller || !bar) return;
    var lastY = 0;
    scroller.addEventListener('scroll', function () {
      var y = scroller.scrollTop;
      if (y <= 8) bar.classList.remove('mobile-subbar--hidden');
      else if (y > lastY + 6) bar.classList.add('mobile-subbar--hidden');
      else if (y < lastY - 6) bar.classList.remove('mobile-subbar--hidden');
      lastY = y;
    }, { passive: true });
  }());
</script>

<script>
  // Touch: long-press a card to start multi-select (there is no hover to reveal
  // the checkbox). A normal tap still opens the image.
  (function () {
    var container = document.getElementById('gallery-results');
    if (!container || typeof imageMultiSelect === 'undefined') return;
    var LONG_MS = 450, MOVE = 10;
    var timer = null, fired = false, sx = 0, sy = 0;

    container.addEventListener('touchstart', function (e) {
      if (imageMultiSelect.active) return;   // already selecting: taps toggle
      var card = e.target.closest('.image-card');
      if (!card) return;
      fired = false;
      var t = e.touches[0]; sx = t.clientX; sy = t.clientY;
      timer = setTimeout(function () {
        fired = true;
        var cb = card.querySelector('.ms-checkbox');
        if (cb) cb.click();                   // selects the card + enters active mode
        if (navigator.vibrate) navigator.vibrate(10);
      }, LONG_MS);
    }, { passive: true });

    container.addEventListener('touchmove', function (e) {
      if (!timer) return;
      var t = e.touches[0];
      if (Math.abs(t.clientX - sx) > MOVE || Math.abs(t.clientY - sy) > MOVE) {
        clearTimeout(timer); timer = null;
      }
    }, { passive: true });

    function done() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!fired) return;
      fired = false;
      // Swallow the click this touch emits so it doesn't immediately toggle the
      // freshly selected card back off.
      var swallow = function (ev) { ev.stopPropagation(); ev.preventDefault(); };
      document.addEventListener('click', swallow, true);
      setTimeout(function () { document.removeEventListener('click', swallow, true); }, 500);
    }
    container.addEventListener('touchend', done);
    container.addEventListener('touchcancel', done);
  }());
</script>
