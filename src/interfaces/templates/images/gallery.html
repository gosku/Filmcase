<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <script src="/static/js/multi-select.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
  <link rel="stylesheet" href="/static/css/brand.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; font-family: sans-serif; height: 100vh; overflow: hidden; }

    .content-area { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    .sidebar {
      width: 320px;
      min-width: 320px;
      padding: 1.5rem;
      border-right: 1px solid #e0e0e0;
      overflow-y: auto;
      background: var(--color-bg-surface);
    }

    .sidebar h2 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      margin-bottom: 1.5rem;
    }

    .filter-group {
      margin-bottom: 1.2rem;
    }

    .filter-label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #444;
      margin-bottom: 0.35rem;
    }

    .filter-select {
      width: 100%;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      background: #fff;
      cursor: pointer;
    }

    /* Tune Tom Select to match sidebar width */
    .ts-wrapper { width: 100%; }
    .ts-control { font-size: 0.9rem; }
    .ts-wrapper.single.has-items .ts-control input { width: 0; min-width: 0; }

    .clear-filters-btn {
      display: block;
      width: 100%;
      padding: 0.35rem 0.5rem;
      margin-bottom: 1.2rem;
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #666;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .clear-filters-btn:hover {
      background: #f0f0f0;
      color: #333;
    }

    .filter-checkboxes {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      max-height: 180px;
      overflow-y: auto;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.1rem 0.2rem;
      border-radius: 3px;
      color: #333;
      user-select: none;
    }

    .filter-option input[type="checkbox"] {
      accent-color: var(--color-accent);
    }

    .filter-option:hover { background: #f0f0f0; }

    .filter-option--unavailable {
      color: #bbb;
    }

    .filter-option--unavailable input[type="checkbox"] {
      opacity: 0.4;
    }

    .filter-option-value {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filter-option-count {
      font-size: 0.75rem;
      color: #999;
      flex-shrink: 0;
    }

    .filter-option--unavailable .filter-option-count {
      color: #ccc;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 2rem 1rem;
      flex-shrink: 0;
    }

    .gallery-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 2rem 2rem;
    }

    .gallery-header h1 {
      font-size: 1.5rem;
      color: #222;
    }

    .rating-toggle {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: #555;
      user-select: none;
    }

    .rating-toggle input[type="checkbox"] {
      appearance: none;
      width: 2rem;
      height: 1.1rem;
      background: #ccc;
      border-radius: 1rem;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .rating-toggle input[type="checkbox"]:checked {
      background: var(--color-accent);
    }

    .rating-toggle input[type="checkbox"]::after {
      content: '';
      position: absolute;
      width: 0.85rem;
      height: 0.85rem;
      background: #fff;
      border-radius: 50%;
      top: 0.125rem;
      left: 0.125rem;
      transition: left 0.2s;
    }

    .rating-toggle input[type="checkbox"]:checked::after {
      left: calc(100% - 0.975rem);
    }

    #gallery-results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .infinite-scroll-sentinel {
      height: 300px;
      visibility: hidden;
      pointer-events: none;
    }

    .image-card {
      min-width: 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.5rem;
      background: #fff;
    }

    .image-thumbnail {
      width: 100%;
      height: 300px;
      object-fit: contain;
      display: block;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      background: #f0f0f0;
    }

    .image-recipe {
      display: block;
      font-weight: 600;
      font-size: 1rem;
      color: #222;
      margin-bottom: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .image-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.15rem;
    }

    .image-exposure {
      font-size: 0.9rem;
      color: #555;
    }

    .image-filename {
      font-size: 0.85rem;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
    }

    .recipe-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.3rem;
    }

    .recipe-label {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .rl-dr, .rl-drp,
    .rl-gr, .rl-gs,
    .rl-cce, .rl-ccfx,
    .rl-wb,
    .rl-r, .rl-b,
    .rl-hl, .rl-sh,
    .rl-co, .rl-srp,
    .rl-ns, .rl-cl {
      background: #eef0f3;
      color: #3d4754;
    }

    .image-rating {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-accent);
      background: var(--color-accent-light);
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
    }

    .no-results {
      grid-column: 1 / -1;
      color: #888;
      font-style: italic;
    }

    .gallery-header {
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
      flex-shrink: 0;
      min-height: 4rem;
    }

    /* ── Multi-select ────────────────────────────────────────────────── */
    .image-card {
      position: relative;
    }

    .image-card .ms-checkbox {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s, background 0.12s, border-color 0.12s;
      cursor: pointer;
      z-index: 2;
    }

    .image-card:hover .ms-checkbox,
    #gallery-results.ms-active .image-card .ms-checkbox {
      opacity: 1;
      pointer-events: auto;
    }

    .image-card .ms-checkbox:hover {
      border-color: var(--color-accent);
      background: var(--color-accent-light);
    }

    .image-card .ms-check {
      opacity: 0;
      transition: opacity 0.12s;
    }

    .image-card.ms-selected .ms-checkbox {
      background: var(--color-accent);
      border-color: var(--color-accent);
    }

    .image-card.ms-selected .ms-check {
      opacity: 1;
    }

    .image-card.ms-selected {
      outline: 3px solid var(--color-accent);
      outline-offset: -3px;
    }

    #detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
    }

    #detail-overlay .detail-overlay {
      height: 100%;
    }
  </style>
</head>
<body>

{% include "_top_nav.html" with active_section="images" %}

<div class="content-area">

<aside class="sidebar">
  <a href="{% url 'gallery' %}?rating_first={{ rating_first }}" class="clear-filters-btn">Clear all filters</a>
  <form id="filter-form"
        hx-get="{% url 'gallery' %}"
        hx-trigger="change"
        hx-target="#gallery-results"
        hx-push-url="true">
    <div class="filter-group">
      <label class="rating-toggle" for="rating-first-toggle">
        <input type="checkbox" id="rating-first-toggle">
        Sort by rating
      </label>
      <input type="hidden" name="rating_first" id="rating-first-input" value="{{ rating_first }}">
    </div>
    {% include "images/_recipe_filter.html" %}
    {% include "images/_sidebar_filters.html" %}
  </form>
</aside>

<main class="main">
  <div class="gallery-header">
    <div class="ms-toolbar" id="ms-toolbar" hidden>
      <span class="ms-count">0 selected</span>
      <button class="ms-cancel-btn" type="button">Cancel</button>
      <div class="ms-actions-wrap">
        <button class="ms-actions-btn" id="ms-actions-btn" type="button">
          Actions
          <svg width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="ms-actions-dropdown" id="ms-actions-dropdown" hidden>
          <span class="ms-actions-empty">No actions available yet</span>
        </div>
      </div>
    </div>
  </div>
  <div class="gallery-scroll">
    <div id="gallery-results">
      {% include "images/_gallery_results.html" %}
    </div>
    <div id="load-more-sentinel">
      {% if page_obj.has_next %}
      <div class="infinite-scroll-sentinel"
           hx-get="{% url 'gallery-results' %}"
           hx-include="#filter-form"
           hx-vals='{"page": "{{ page_obj.next_page_number }}"}'
           hx-trigger="intersect root:.gallery-scroll"
           hx-target="#load-more-sentinel"
           hx-swap="outerHTML">
      </div>
      {% endif %}
    </div>
  </div>
</main>

</div><!-- .content-area -->

<script>
  const imageMultiSelect = new MultiSelectController({
    containerSelector: '#gallery-results',
    cardSelector: '.image-card',
    toolbarSelector: '#ms-toolbar',
  });

  (function () {
    var actionsBtn = document.getElementById('ms-actions-btn');
    var actionsDropdown = document.getElementById('ms-actions-dropdown');
    actionsBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      actionsDropdown.hidden = !actionsDropdown.hidden;
    });
    document.addEventListener('click', function () {
      actionsDropdown.hidden = true;
    });
  }());
</script>

<div id="detail-overlay" hidden></div>

<script>
  // Multi-select recipe dropdown with search and removable tags.
  // Tom Select hides the original <select multiple>, so we relay its onChange
  // as a native change event on the form so HTMX picks it up.
  // Selected items appear as visible tags in the control (top of the widget).
  function initRecipeSelects() {
    document.querySelectorAll('.filter-select-search').forEach(function (el) {
      if (el.tomselect) return; // already initialised
      new TomSelect(el, {
        create: false,
        plugins: ['remove_button'],
        onChange: function () {
          document.getElementById('filter-form').dispatchEvent(new Event('change'));
        },
      });
    });
  }
  initRecipeSelects();

  // When HTMX is about to OOB-swap the recipe filter, update TomSelect's option
  // list in-place instead of replacing the DOM. This preserves the .ts-wrapper
  // (selected pills, search input) and avoids any flicker or layout shift.
  document.body.addEventListener('htmx:oobBeforeSwap', function (evt) {
    if (!evt.detail.target || evt.detail.target.id !== 'recipe-filter') return;
    var select = evt.detail.target.querySelector('.filter-select-search');
    if (!select || !select.tomselect) return;
    // If the new content has no <select>, let the DOM swap happen so the widget
    // is removed when there are no options at all.
    var newSelect = evt.detail.fragment.querySelector('select');
    if (!newSelect) return;

    var ts = select.tomselect;
    var newOpts = Array.from(newSelect.querySelectorAll('option')).map(function (opt) {
      return { value: opt.value, text: opt.textContent.trim() };
    });
    // clearOptions() skips options that are currently selected (in ts.items),
    // so the pills stay intact without any setValue() call. Calling setValue()
    // would internally clear then re-add items, firing a native change event on
    // the underlying <select> that would trigger an unwanted second HTMX request.
    ts.clearOptions();
    ts.addOptions(newOpts);
    ts.refreshOptions(false); // refresh dropdown list without opening it
    evt.detail.shouldSwap = false; // cancel the DOM swap entirely
  });

  // Rating-first toggle: persists in localStorage, syncs with URL param.
  (function () {
    var urlParams = new URLSearchParams(window.location.search);
    var hiddenInput = document.getElementById('rating-first-input');
    var toggle = document.getElementById('rating-first-toggle');

    var val;
    if (urlParams.has('rating_first')) {
      val = urlParams.get('rating_first');
    } else {
      val = localStorage.getItem('ratingFirst') ?? '1';
      // Reflect current preference in the URL without a new history entry.
      urlParams.set('rating_first', val);
      history.replaceState(null, '', '?' + urlParams.toString());
      // If server rendered with its default (1) but preference is off, re-fetch.
      if (val !== '1') {
        hiddenInput.value = val;
        document.getElementById('filter-form').dispatchEvent(new Event('change'));
      }
    }
    localStorage.setItem('ratingFirst', val);
    hiddenInput.value = val;
    toggle.checked = (val === '1');

    toggle.addEventListener('change', function () {
      var newVal = toggle.checked ? '1' : '0';
      hiddenInput.value = newVal;
      localStorage.setItem('ratingFirst', newVal);
      document.getElementById('filter-form').dispatchEvent(new Event('change'));
    });
  }());

  // Detail overlay logic.

  function closeDetail() {
    document.getElementById('detail-overlay').hidden = true;
    document.querySelector('.gallery-scroll').style.overflow = '';
    var params = new URLSearchParams(window.location.search);
    history.replaceState(null, '', '/images/' + (params.toString() ? '?' + params.toString() : ''));
  }

  window._detailClose = closeDetail;

  document.body.addEventListener('htmx:beforeHistoryUpdate', function (e) {
    if (e.detail.target && e.detail.target.id === 'detail-overlay') {
      var params = new URLSearchParams(window.location.search);
      if (params.toString()) {
        e.detail.history.path = e.detail.history.path + '?' + params.toString();
      }
    }
  });

  var preloadedUrls = new Set();

  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.detail.target.id !== 'detail-overlay') return;
    var overlay = e.detail.target;
    overlay.hidden = false;
    document.querySelector('.gallery-scroll').style.overflow = 'hidden';

    var img = overlay.querySelector('.detail-image');
    if (!img || !img.dataset.fullSrc) return;
    var fullSrc = img.dataset.fullSrc;

    function afterFullLoaded() {
      img.src = fullSrc;
      var nextUrl = overlay.querySelector('.detail-nav-next')?.dataset.preloadUrl;
      var prevUrl = overlay.querySelector('.detail-nav-prev')?.dataset.preloadUrl;
      if (nextUrl && !preloadedUrls.has(nextUrl)) {
        var n = new Image();
        n.onload = function () { preloadedUrls.add(nextUrl); };
        n.src = nextUrl;
      }
      if (prevUrl && !preloadedUrls.has(prevUrl)) {
        var p = new Image();
        p.onload = function () { preloadedUrls.add(prevUrl); };
        p.src = prevUrl;
      }
    }

    if (preloadedUrls.has(fullSrc)) {
      afterFullLoaded();
    } else {
      var full = new Image();
      full.onload = afterFullLoaded;
      full.src = fullSrc;
    }
  });

  document.addEventListener('keydown', function (e) {
    var overlay = document.getElementById('detail-overlay');
    if (!overlay || overlay.hidden) return;
    if (e.key === 'Escape') closeDetail();
    if (e.key === 'ArrowLeft') { var btn = overlay.querySelector('.detail-nav-prev'); if (btn) btn.click(); }
    if (e.key === 'ArrowRight') { var btn = overlay.querySelector('.detail-nav-next'); if (btn) btn.click(); }
  });
</script>
</body>
</html>
