<style>
  .card-modal {
    background: #fff;
    border-radius: 16px;
    padding: 2rem;
    width: 1340px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
  }

  .card-modal-header {
    background: #1e1e1e;
    border-radius: 14px 14px 0 0;
    padding: 1.1rem 1.5rem;
    margin: -2rem -2rem 1.5rem -2rem;
    text-align: center;
    position: relative;
  }

  .card-modal-close {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.65);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .card-modal-close:hover { background: rgba(255,255,255,0.2); }

  .card-modal-title {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.45);
    margin-bottom: 0.3rem;
  }

  .card-modal-recipe-name {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
  }

  .card-modal-body {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
    gap: 2rem;
    align-items: start;
  }

  .card-section-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #999;
    margin-bottom: 0.75rem;
  }

  .card-image-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .card-image-option {
    position: relative;
  }

  .card-image-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .card-image-option label {
    display: block;
    width: 76px;
    height: 76px;
    border-radius: 8px;
    overflow: hidden;
    border: 3px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .card-image-option label img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-image-option input[type="radio"]:checked + label {
    border-color: var(--color-accent);
  }

  .card-no-image-option {
    position: relative;
  }

  .card-no-image-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .card-no-image-option label {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 76px;
    height: 76px;
    border-radius: 8px;
    border: 3px solid #e0e0e0;
    cursor: pointer;
    background: #f5f5f5;
    color: #999;
    font-size: 0.65rem;
    text-align: center;
    line-height: 1.3;
    transition: border-color 0.15s;
  }

  .card-no-image-option input[type="radio"]:checked + label {
    border-color: var(--color-accent);
    color: var(--color-accent);
  }

  .card-template-options {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .card-option-row {
    display: flex;
    align-items: stretch;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .card-option-group {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .card-option-group .card-section-label {
    margin-bottom: 0.75rem;
  }

  .card-option-group .card-template-options {
    flex: 1;
    margin-bottom: 0;
  }

  .card-template-option {
    position: relative;
    flex: 1;
    display: flex;
  }

  .card-template-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .card-template-option label {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 5.25rem;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 2px solid #e0e0e0;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .card-template-option input[type="radio"]:checked + label {
    border-color: var(--color-accent);
    background: var(--color-accent-light);
  }

  .card-template-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: #222;
    margin-bottom: 0.25rem;
  }

  .card-template-desc {
    font-size: 0.72rem;
    color: #777;
  }

  .card-create-btn {
    width: 100%;
    padding: 0.875rem;
    border: none;
    border-radius: 10px;
    background: var(--color-accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .card-create-btn:hover { background: var(--color-accent-dark); }
  .card-create-btn[aria-busy="true"] { opacity: 0.6; cursor: not-allowed; }

  .card-result-col {
    display: flex;
    flex-direction: column;
  }

  .card-result-placeholder {
    aspect-ratio: 1;
    border-radius: 10px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #bbb;
    font-size: 0.85rem;
  }

  .card-design-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .card-design-tab {
    flex: 1;
    padding: 0.6rem 0.75rem;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    background: #fff;
    color: #555;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }

  .card-design-tab:hover { border-color: #ccc; }

  .card-design-tab.active {
    border-color: var(--color-accent);
    background: var(--color-accent-light);
    color: var(--color-accent);
  }

  .card-design-note {
    padding: 0.25rem 0 1rem;
  }

  .card-design-note-title {
    font-size: 0.9rem;
    font-weight: 700;
    color: #222;
    margin-bottom: 0.35rem;
  }

  .card-design-note-text {
    font-size: 0.8rem;
    line-height: 1.5;
    color: #777;
  }
</style>

<div class="card-modal">
  <div class="card-modal-header">
    <button class="card-modal-close" onclick="closeCardOverlay()" title="Close">&#x2715;</button>
    <p class="card-modal-title">Create Recipe Card</p>
    <p class="card-modal-recipe-name">{{ recipe.display_name }}</p>
  </div>

  <div class="card-modal-body">
    <form id="card-create-form">
      {% if images %}
        <p class="card-section-label">Background image (optional)</p>
        <div class="card-image-gallery">
          <div class="card-no-image-option" id="card-gradient-option">
            <input type="radio" name="image_id" id="card-no-image" value="" checked>
            <label for="card-no-image">Gradient<br>background</label>
          </div>
          {% for img in images %}
            <div class="card-image-option">
              <input type="radio" name="image_id" id="card-img-{{ img.pk }}" value="{{ img.pk }}">
              <label for="card-img-{{ img.pk }}">
                <img src="{% url 'image-file' image_id=img.pk %}?width=600" alt="" loading="lazy">
              </label>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <p class="card-section-label">Design</p>
      <div class="card-design-tabs"
           data-options-url="{% url 'recipe-card-design-options' %}">
        <button type="button" class="card-design-tab active" data-design="classic"
                onclick="selectCardDesign('classic')">Classic</button>
        <button type="button" class="card-design-tab" data-design="aperture"
                onclick="selectCardDesign('aperture')">Aperture</button>
        <button type="button" class="card-design-tab" data-design="contact_sheet"
                onclick="selectCardDesign('contact_sheet')">Contact Sheet</button>
      </div>

      <input type="hidden" name="design" id="card-design-input" value="classic">

      <div id="card-design-options">
        {% include "recipes/partials/card_design_options/classic.html" %}
      </div>

      <button type="button"
              class="card-create-btn"
              hx-post="{% url 'create-recipe-card' recipe_id=recipe.pk %}"
              hx-include="#card-create-form"
              hx-target="#card-preview-pane"
              hx-swap="innerHTML"
              hx-indicator=".card-create-btn">
        Create Recipe Card
      </button>
    </form>

    <div class="card-result-col">
      <div id="card-preview-pane"
           hx-get="{% url 'recipe-card-preview' recipe_id=recipe.pk %}"
           hx-include="#card-create-form"
           hx-trigger="load, change from:#card-create-form"
           hx-target="this"
           hx-swap="innerHTML">
        <div class="card-result-placeholder">Loading preview…</div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  function optionsUrl(design) {
    var tabs = document.querySelector('.card-design-tabs');
    return tabs.dataset.optionsUrl + '?design=' + encodeURIComponent(design);
  }

  // Photo-centric designs cannot use the gradient background: hide that option
  // and make sure a real image is selected when one of them is active.
  function updateGradientVisibility() {
    var form = document.getElementById('card-create-form');
    var requiresImage = form.dataset.requiresImage === 'true';
    var gradient = document.getElementById('card-gradient-option');
    if (!gradient) { return; }
    gradient.style.display = requiresImage ? 'none' : '';
    if (requiresImage) {
      var gradientRadio = gradient.querySelector('input[type=radio]');
      if (gradientRadio && gradientRadio.checked) {
        var firstImage = form.querySelector('.card-image-option input[type=radio]');
        if (firstImage) { firstImage.checked = true; }
      }
    }
  }

  window.selectCardDesign = function (design) {
    document.querySelectorAll('.card-design-tab').forEach(function (tab) {
      tab.classList.toggle('active', tab.dataset.design === design);
    });
    document.getElementById('card-design-input').value = design;
    var form = document.getElementById('card-create-form');
    form.dataset.requiresImage = (design === 'classic') ? 'false' : 'true';
    updateGradientVisibility();
    // Load this design's options, then nudge the live preview to refresh (the
    // preview pane listens for a change bubbling from the form).
    var refresh = function () {
      form.dispatchEvent(new Event('change', { bubbles: true }));
    };
    var request = window.htmx.ajax('GET', optionsUrl(design), {
      target: '#card-design-options',
      swap: 'innerHTML',
    });
    if (request && typeof request.then === 'function') {
      request.then(refresh);
    } else {
      setTimeout(refresh, 120);
    }
  };
})();
</script>
