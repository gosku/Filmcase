<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Network</title>
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <link rel="stylesheet" href="/static/css/brand.css">
  <link rel="stylesheet" href="/static/css/recipe-graph.css">
</head>
<body>

{% include "_top_nav.html" with active_section="recipes" %}

<div class="content-area">

  <aside class="sidebar">
    <nav class="sidebar-nav">
      <a href="{% url 'recipes-explorer' %}" class="sidebar-nav__link">Explorer</a>
      <a href="{% url 'recipes-graph' %}" class="sidebar-nav__link sidebar-nav__link--active">Graph</a>
    </nav>

    <div class="sidebar-filter">
      <label class="sidebar-filter__label" for="film-sim-select">Film Simulation</label>
      <select class="sidebar-filter__select" id="film-sim-select">
        {% for sim in film_simulations %}
        <option value="{{ sim }}"{% if sim == active_film_simulation %} selected{% endif %}>{{ sim }}</option>
        {% endfor %}
      </select>
    </div>
  </aside>

  <main class="main">
    <div class="section-header">
      <span class="graph-hint">Root = most-used recipe &mdash; click a node to inspect it</span>
    </div>

    <div class="graph-body">
      <div class="graph-canvas" id="cy"></div>
      {% include "recipes/includes/graph_panel.html" %}
    </div>
  </main>

</div><!-- .content-area -->

{% include "recipes/_compare_overlay.html" %}
{% include "recipes/includes/graph_tooltip.html" %}

<script id="init-data" type="application/json">
  {
    "active_film_sim": "{{ active_film_simulation|escapejs }}",
    "root_id": {% if root_id %}{{ root_id }}{% else %}null{% endif %},
    "root_label": "{{ root_label|escapejs }}",
    "root_fields": {{ root_fields_json|safe }},
    "elements": {{ graph_elements_json|safe }}
  }
</script>
<script src="/static/js/recipe-compare-overlay.js"></script>
<script src="/static/js/recipe-graph.js"></script>
<script>
  (function () {
    var initData = JSON.parse(document.getElementById("init-data").textContent);
    var defaultFilmSim = initData.active_film_sim;

    var graph = RecipeGraph.init({
      containerId: "cy",
      elements: initData.elements,
      rootId: initData.root_id,
      rootLabel: initData.root_label,
      rootFields: initData.root_fields,
      onSelectedGraphRequested: function (nodeId) {
        window.location.href = "/recipes/graph/" + nodeId + "/";
      },
    });

    var select = document.getElementById("film-sim-select");

    function loadFilmSim(sim, pushState) {
      var url = "/recipes/graph/?film_sim=" + encodeURIComponent(sim);
      if (pushState) {
        history.pushState(null, "", url);
      }
      fetch(url, {headers: {"Accept": "application/json"}})
        .then(function (response) { return response.json(); })
        .then(function (data) {
          graph.replaceGraph({
            elements: data.elements,
            rootId: data.root_id,
            rootLabel: data.root_label,
            rootFields: data.root_fields,
          });
        });
    }

    select.addEventListener("change", function () {
      loadFilmSim(this.value, true);
    });

    // Keep the dropdown and the graph in step with browser history.
    window.addEventListener("popstate", function () {
      var params = new URLSearchParams(window.location.search);
      var sim = params.get("film_sim") || defaultFilmSim;
      if (select.value !== sim) {
        select.value = sim;
        loadFilmSim(sim, false);
      }
    });
  })();
</script>
</body>
</html>
