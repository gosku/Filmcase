<tr>
  <td class="folder-path">{{ folder.path }}</td>
  <td class="folder-meta">
    {% if folder.last_processed_at %}
      <time class="local-time" data-utc="{{ folder.last_processed_at|date:"c" }}">{{ folder.last_processed_at|date:"Y-m-d H:i" }}</time>
    {% else %}
      <span style="color: #ccc;">Never</span>
    {% endif %}
  </td>
  <td class="folder-meta">
    {% if folder.last_checked_at %}
      <time class="local-time" data-utc="{{ folder.last_checked_at|date:"c" }}">{{ folder.last_checked_at|date:"Y-m-d H:i" }}</time>
    {% else %}
      <span style="color: #ccc;">Never</span>
    {% endif %}
  </td>
  <td class="folder-sync">
    <div
      hx-get="{% url 'library-folder-sync-status' folder.folder_id %}"
      hx-trigger="load"
      hx-swap="outerHTML"
    ></div>
  </td>
  <td class="folder-actions">
    <button
      class="btn-update"
      onclick="openBrowserModal({{ folder.folder_id }}, '{{ folder.path|escapejs }}')"
    >Update Path</button>
    <button
      class="btn-remove"
      onclick="openRemoveFolderModal('{% url 'library-folder-confirm-delete' folder.folder_id %}')"
    >Remove</button>
  </td>
</tr>
